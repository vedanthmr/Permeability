name: Release Windows Standalone Executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build & Package Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build & Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Verify Model Weights and Artifacts
        run: |
          python -c "import joblib, os; assert os.path.exists('models/trained_prompt_injection/classifier.joblib'), 'Model missing!'"

      - name: Build Standalone Windows Executable
        run: |
          python build_exe.py

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AdaptShield-Windows-x64.zip
            dist/AdaptShield.exe
          draft: false
          prerelease: false
          generate_release_notes: true

